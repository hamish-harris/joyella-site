<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyella Studios</title>
<meta name="description" content="Joyella Studios. A design studio in London.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E4E2DB;
    --ink:#23241F;
    --ink-soft:#6E7067;
    --hairline:#C7C4BA;
    --lichen:#5F6653;
    --axis: 34%;
    --gutter: clamp(22px, 5vw, 76px);
    --step: clamp(110px, 21vh, 250px);
    --sans: "Neue Haas Grotesk Display Pro","NHaasGroteskDSPro","Founders Grotesk","GT America","Helvetica Now Display","Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
    --serif: "EB Garamond","Adobe Garamond Pro","Sabon",Georgia,"Times New Roman",serif;
  }

  *,*::before,*::after{box-sizing:border-box;}

  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    font-weight:400;
    line-height:1.65;
    letter-spacing:-0.005em;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* --- atmosphere: slow light across a plaster wall, and paper grain --- */
  .light{
    position:fixed;
    top:-40vh; left:-30vw;
    width:120vw; height:140vh;
    pointer-events:none;
    z-index:0;
    background:radial-gradient(45% 40% at 50% 50%, rgba(255,253,246,0.9) 0%, rgba(255,253,246,0.45) 42%, rgba(255,253,246,0) 72%);
    filter:blur(28px);
    animation:drift 96s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{ transform:translate3d(0,0,0) scale(1); }
    to  { transform:translate3d(26vw,14vh,0) scale(1.18); }
  }

  .grain{
    position:fixed;
    inset:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index:1;
    opacity:0.5;
    mix-blend-mode:multiply;
  }

  .page{position:relative; z-index:2;}

  .wrap{
    max-width:1440px;
    margin:0 auto;
    padding-left:var(--gutter);
    padding-right:var(--gutter);
  }

  /* --- masthead + statement --- */
  .hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    padding-top:clamp(22px,4.5vh,44px);
    padding-bottom:clamp(28px,6vh,60px);
  }

  .mark{
    font-size:13.5px;
    letter-spacing:0.01em;
    margin:0;
    font-weight:400;
  }

  .hero-foot{
    margin-top:auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:48px;
    flex-wrap:wrap;
  }

  .statement{
    margin:0;
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(2.4rem,7.4vw,6.2rem);
    line-height:1.0;
    letter-spacing:-0.018em;
  }

  .whereabouts{
    margin:0 0 0.5rem 0;
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink-soft);
    text-align:right;
    max-width:22ch;
  }

  /* --- the address --- */
  .band{padding-top:var(--step);}

  .rule{
    height:1px;
    background:var(--hairline);
    border:0;
    width:62%;
    margin:0 0 clamp(30px,5vh,58px) 0;
  }

  .say{
    margin:0 0 0 var(--axis);
    font-size:clamp(1.4rem,3.4vw,2.3rem);
    letter-spacing:-0.028em;
    line-height:1.25;
  }
  .say a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--hairline);
    padding-bottom:2px;
    transition:border-color .4s ease, color .4s ease;
  }
  .say a:hover{border-bottom-color:var(--lichen); color:var(--lichen);}
  .say a:focus-visible{outline:1px solid var(--lichen); outline-offset:6px; border-bottom-color:transparent;}

  /* --- colophon --- */
  .colophon{
    margin-top:var(--step);
    padding:22px 0 26px 0;
    border-top:1px solid var(--hairline);
    display:flex;
    justify-content:space-between;
    gap:24px;
    font-size:13px;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }
  .colophon p{margin:0;}

  /* --- one orchestrated arrival, on load only --- */
  .rise{opacity:0; transform:translateY(14px); animation:rise 1.5s cubic-bezier(.2,.7,.2,1) forwards;}
  .d1{animation-delay:.15s;}
  .d2{animation-delay:.65s;}
  .d3{animation-delay:.95s;}
  @keyframes rise{to{opacity:1; transform:none;}}

  @media (max-width:820px){
    :root{--axis:0%;}
    .hero-foot{align-items:flex-start; gap:26px;}
    .whereabouts{text-align:left; margin-bottom:0;}
    .statement{font-size:clamp(1.9rem,8.4vw,3.4rem);}
    .rule{width:82%;}
  }

  @media (prefers-reduced-motion:reduce){
    .light{animation:none;}
    .rise{opacity:1; transform:none; animation:none;}
    *{transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<div class="light" aria-hidden="true"></div>

<svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <filter id="paperGrain">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#paperGrain)"/>
</svg>

<div class="page">
  <div class="wrap">

    <header class="hero">
      <p class="mark rise d1">Joyella Studios</p>

      <div class="hero-foot">
        <h1 class="statement rise d2">We make<br>unnecessary apps<br>you&rsquo;ll love.</h1>
        <p class="whereabouts rise d3">A design studio in London.</p>
      </div>
    </header>

    <section class="band" aria-label="Contact">
      <hr class="rule">
      <p class="say"><a href="mailto:hello@joyellastudios.com">hello@joyellastudios.com</a></p>
    </section>

    <footer class="colophon">
      <p>Joyella Studios, London</p>
      <p>&copy; 2026</p>
    </footer>

  </div>
</div>

</body>
</html>
